{{- $title := .Get "title" -}}
{{- $image := .Get "image" -}}
{{- $link  := .Get "link"  -}}

<a href="{{ $link }}" class="sbol-card sbol-card--figure is-link">
  <div class="sbol-card__figure">
    <img src="{{ $image }}" alt="{{ $title }}" width="1280" height="1920" loading="lazy" decoding="async">
  </div>
  <div class="sbol-card__label">{{ $title }}</div>
</a>
