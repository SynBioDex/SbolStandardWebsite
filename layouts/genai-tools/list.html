{{ define "main" }}
{{ partial "sbol/hero.html" . }}
<div class="universal-wrapper">
  <div class="sbol-cards sbol-cards--wide">
    {{ range .Pages }}
    {{ $url := .Params.external_url | default .Permalink }}
    <a href="{{ $url }}" class="sbol-card is-link"{{ if hasPrefix $url "http" }} target="_blank" rel="noopener"{{ end }}>
      <div class="sbol-badges">
        {{ with .Params.platform }}<span class="sbol-badge sbol-badge--blue">{{ . }}</span>{{ end }}
        {{ with .Params.sbol_version }}<span class="sbol-badge sbol-badge--green">SBOL {{ . }}</span>{{ end }}
      </div>
      <h2 class="sbol-card__title">{{ .Title }}</h2>
      <p class="sbol-card__desc">{{ .Params.summary }}</p>
      <span class="sbol-link-more">Try it &rarr;</span>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
